# Render Blueprint for Bountyline.
# Secrets marked sync: false are entered once in the dashboard when the Blueprint is created.
envVarGroups:
  - name: bountyline-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_ENV
        value: sandbox
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_DAILY_REQUEST_LIMIT
        value: '450'
      - key: GEMINI_API_KEY
        sync: false

services:
  - type: web
    name: bountyline
    runtime: node
    region: oregon
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm --filter @bountyline/api start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - fromGroup: bountyline-shared
      - key: DATABASE_URL
        fromDatabase:
          name: bountyline-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: CHECK_RUNNER
        value: render
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKFLOW_SLUG
        value: bountyline-checks
      - key: JUDGE_MODE
        value: 'true'
      - key: DEMO_MANAGER_EMAIL
        value: manager@bountyline.demo
      - key: DEMO_MANAGER_PASSWORD
        sync: false
      - key: DEMO_CLAIMANT_PAYPAL_EMAIL
        sync: false
      - key: VITE_AG_STUDIO_LICENSE_KEY
        sync: false

  # Optional: run claim checks on Render Workflows. Uncomment once Workflows is enabled on the
  # account and RENDER_API_KEY is set on the web service; without it, checks run in the web service.
  # Compute plans are set per task in code, so there is no plan field here.
  # - type: workflow
  #   name: bountyline-checks
  #   runtime: node
  #   region: oregon
  #   buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter "@bountyline/workflows..." build
  #   startCommand: pnpm --filter @bountyline/workflows start
  #   envVars:
  #     - fromGroup: bountyline-shared
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: bountyline-db
  #         property: connectionString

databases:
  - name: bountyline-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: '17'
    databaseName: bountyline
    user: bountyline
